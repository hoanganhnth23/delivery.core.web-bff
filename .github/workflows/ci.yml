name: Service CI

on:
  push:
    branches: [main, staging]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-pipeline:
    name: "Pipeline"
    uses: hoanganhnth23/delivery.devops.centralized-ci/.github/workflows/build-java.yml@main
    with:
      service_name: "web-bff"
      image_name: "web-bff-service"
      dockerfile: "./Dockerfile"
      platform: "linux/amd64"
    secrets: inherit
